[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/souzajluiz/phpthunder"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
phpthunder = { path = "crates/phpthunder" }
parking_lot = "0.12.5"
tokio = { version = "1.53.2", features = ["full"] }
tree-sitter = "0.27.1"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -2 }
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
unwrap_used = { level = "deny", priority = 9 }
missing_docs_in_private_items = { level = "warn", priority = 9 }

# Dependencies (iced, wgpu, naga, …) are never stepped through: building them
# without debug info keeps `target/debug` a fraction of the size.
[profile.dev.package."*"]
debug = false
