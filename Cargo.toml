[package]
name = "phpthunder"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot = "0.12.5"
rayon = "1.12.0"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tower-lsp = "0.20.0"
tree-sitter = "0.27.1"
tree-sitter-php = "0.25.1"
walkdir = "2.5.0"

[workspace]
members = [".", "ide"]

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -2 }
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
unwrap_used = { level = "deny", priority = 9 }
missing_docs_in_private_items = { level = "warn", priority = 9 }

[lints]
workspace = true
