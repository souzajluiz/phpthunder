[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/souzajluiz/phpthunder"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
phpthunder = { path = "crates/phpthunder" }
parking_lot = "0.12.5"
tokio = { version = "1.53.2", features = ["full"] }
tree-sitter = "0.27.1"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -2 }
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
unwrap_used = { level = "deny", priority = 9 }
missing_docs_in_private_items = { level = "warn", priority = 9 }

# Dependencies (iced, wgpu, naga, …) are never stepped through: building them
# without debug info keeps `target/debug` a fraction of the size.
[profile.dev.package."*"]
debug = false
# Optimized even in dev: loading a large project's index cache (bincode,
# serde) and rendering stay fast while the IDE crate itself builds quickly.
opt-level = 2

# The analysis engine does the heavy lifting on project open; unoptimized it
# makes `scripts/dev.sh` several times slower than a release build.
[profile.dev.package.phpthunder]
opt-level = 2

# The IDE redraws, highlights and edits on every key: unoptimized, typing
# in a large file lagged. Level 1 keeps rebuilds quick.
[profile.dev.package.phpthunder-ide]
opt-level = 1

# Shipped builds: cross-crate inlining and one codegen unit make the engine
# faster, and stripping symbols keeps the bundle small.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
