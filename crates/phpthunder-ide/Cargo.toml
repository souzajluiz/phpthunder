[package]
name = "phpthunder-ide"
description = "Native PHP IDE built with iced on the phpthunder engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Junior Souza"]

[dependencies]
base64 = "0.23.1"
fluent-bundle = "0.16.0"
iced = { version = "0.14.0", features = ["svg", "canvas", "tokio", "advanced", "image-without-codecs", "markdown"] }
# Image previews: only the common web formats, not every codec iced's
# `image` feature would pull in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
notify = "8.2.0"
parking_lot.workspace = true
phpthunder.workspace = true
png = "0.17.16"
portable-pty = "0.9.0"
quick-xml = "0.42.0"
regex = "1.13.1"
rfd = "0.17.2"
serde.workspace = true
serde_json = "1.0.154"
# Session and user settings files; only the JSON and TOML formats, to stay light.
universal-config = { version = "0.5.1", default-features = false, features = ["json", "toml"] }
similar = "3.2.0"
sys-locale = "0.3.2"
tokio.workspace = true
tree-sitter.workspace = true
unic-langid = "0.9.6"
vt100 = "0.16.2"
# Desktop notifications; on Linux over D-Bus with the tokio runtime the IDE
# already ships instead of a second async executor.
notify-rust = { version = "4.18.2", default-features = false, features = ["z-with-tokio"] }

# The macOS app menu's About item (see `native_menu`); same versions winit
# and rfd already pull in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSObject"] }

[dev-dependencies]
fluent-syntax = "0.12.0"

[lints]
workspace = true

# macOS/Windows/Linux app bundle (`cargo bundle -p phpthunder-ide --release`).
[package.metadata.bundle]
name = "PhpThunder"
identifier = "dev.phpthunder.ide"
icon = ["assets/brand/app-icon.icns", "assets/brand/app-icon-512.png", "assets/brand/app-icon-256.png", "assets/brand/app-icon-128.png", "assets/brand/app-icon-32.png"]
category = "public.app-category.developer-tools"
short_description = "Native PHP IDE"
