[package]
name = "phpthunder-ide"
description = "Native PHP IDE built with iced on the phpthunder engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fluent-bundle = "0.16.0"
iced = { version = "0.14.0", features = ["svg", "tokio", "advanced"] }
parking_lot.workspace = true
phpthunder.workspace = true
portable-pty = "0.9.0"
quick-xml = "0.42.0"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio.workspace = true
tree-sitter.workspace = true
unic-langid = "0.9.6"
vt100 = "0.16.2"

[dev-dependencies]
fluent-syntax = "0.12.0"

[lints]
workspace = true

# macOS/Windows/Linux app bundle (`cargo bundle -p phpthunder-ide --release`).
[package.metadata.bundle]
name = "PhpThunder"
identifier = "dev.phpthunder.ide"
icon = ["assets/brand/app-icon.icns", "assets/brand/app-icon-512.png", "assets/brand/app-icon-256.png", "assets/brand/app-icon-128.png", "assets/brand/app-icon-32.png"]
category = "public.app-category.developer-tools"
short_description = "Native PHP IDE"
